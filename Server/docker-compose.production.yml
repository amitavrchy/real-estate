name: haven

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://haven:${DATABASE_PASSWORD:?Set a random URL-safe database password}@postgres:5432/haven?schema=public
  JWT_SECRET: ${JWT_SECRET:?Set a random JWT signing secret}
  CLIENT_ORIGIN: https://${SITE_HOSTNAME:?Set your public site hostname}
  TRUST_PROXY: 172.30.0.10
  PORT: 4100

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set a random database password}
      POSTGRES_DB: haven
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U haven -d haven']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    logging: *logging
    build:
      context: .
      target: migrate
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    logging: *logging
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]

  web:
    logging: *logging
    build:
      context: ../Clients
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_HOSTNAME:?Set your public site hostname}
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://api:4100
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]

  proxy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:?Set your public site hostname}
      CERT_EMAIL: ${CERT_EMAIL:?Set certificate contact email}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.0.10

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
